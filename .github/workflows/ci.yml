name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Swift Core tests (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          swift --version

      - name: Resolve packages
        run: swift package resolve

      # Full CAMAssistantApp + AppModel() can crash swift-frontend (signal 10) on
      # some GitHub-hosted toolchains during SILGen. Core library + Core tests
      # cover vault, Direction, Keep, Ask policy, and backup — the product spine.
      - name: Build Core
        run: swift build --target CAMAssistantCore --disable-sandbox

      - name: Test Core (Direction, Keep, Ask, backup, portability-related)
        run: |
          swift test --target CAMAssistantCoreTests --disable-sandbox \
            --filter DirectionProfileStoreTests \
            --filter DirectionTalkCoordinatorTests \
            --filter LocalAnswerCoordinatorTests \
            --filter KeptMemoryTests \
            --filter FullVaultBackupTests \
            --filter ConversationTests

      - name: Portability contract
        run: /bin/zsh scripts/verify.sh portability
