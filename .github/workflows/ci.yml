name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Swift test (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          swift --version

      - name: Resolve packages
        run: swift package resolve

      - name: Build
        run: swift build --disable-sandbox

      - name: Test product spine filters
        run: |
          swift test --disable-sandbox \
            --filter DirectionProfileStoreTests \
            --filter DirectionTalkCoordinatorTests \
            --filter LocalAnswerCoordinatorTests \
            --filter KeptMemoryTests \
            --filter FullVaultBackupTests \
            --filter BarebonesSettingsTests \
            --filter HomePresentationTests \
            --filter BarebonesNavigationTests

      - name: Portability contract
        run: /bin/zsh scripts/verify.sh portability
